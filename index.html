<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MAGI 亚马逊作战系统</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141118;color:#fdf9ff;
 font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
 background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1.5px);background-size:9px 9px}
.box{background:#1d1922;border:3px solid #fdf9ff;border-radius:18px;padding:30px 26px;width:min(340px,86vw);text-align:center;box-shadow:7px 7px 0 #ff2e93}
.logo{font:900 40px/1 "Arial Black",sans-serif;color:#c6f70a;text-shadow:3px 3px 0 #ff2e93;letter-spacing:.04em;transform:rotate(-4deg)}
h1{font-size:16px;margin:10px 0 4px}
p{color:#958ba4;font-size:13px;margin:4px 0 16px}
input[type=password]{width:100%;padding:11px 14px;border:2.5px solid #4b4359;border-radius:12px;background:#141118;color:#fdf9ff;font-size:16px;box-sizing:border-box;outline:none}
input[type=password]:focus{border-color:#c6f70a}
button{width:100%;margin-top:12px;padding:11px;border:3px solid #111;border-radius:999px;background:#ff2e93;color:#fff;font:800 16px sans-serif;cursor:pointer;box-shadow:0 4px 0 #8a0d4c}
button:disabled{opacity:.6}
label{display:flex;gap:6px;align-items:center;justify-content:center;color:#958ba4;font-size:13px;margin-top:12px;cursor:pointer}
.st{font-size:13px;min-height:20px;margin-top:12px;color:#c6f70a}
.st.err{color:#ffe14d}
</style></head><body>
<div class="box">
  <div class="logo">MAGI</div>
  <h1>亚马逊前台运营 AI 系统</h1>
  <p>内容已加密，输入访问密码查看</p>
  <input type="password" id="pw" placeholder="访问密码" autocomplete="current-password">
  <button id="go">解锁</button>
  <label><input type="checkbox" id="rem" checked style="width:auto">在此设备上记住密码</label>
  <div class="st" id="st"></div>
</div>
<script>
const SALT = b64("gSinySHtl1qvUr9uRJfFsw=="), ITER = 150000, V = "47f590524276";
function b64(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function say(t, err) { const el = document.getElementById("st"); el.textContent = t; el.className = "st" + (err ? " err" : ""); }
async function unlock(pw, silent) {
  const btn = document.getElementById("go"); btn.disabled = true;
  try {
    if (!window.crypto || !crypto.subtle) throw new Error("这个浏览器不支持页面解密，请换 Safari / Chrome 最新版打开");
    say("① 校验密码…");
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:SALT, iterations:ITER, hash:"SHA-256"}, km, 256));
    const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
    say("② 下载页面…");
    const r = await fetch("app.bin?v=" + V, {cache: "no-cache"});
    if (!r.ok) throw new Error("页面文件下载失败（" + r.status + "）");
    const buf = new Uint8Array(await r.arrayBuffer());
    say("③ 解密中…");
    let pt;
    try { pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0, 12)}, key, buf.slice(12)); }
    catch (e) { const x = new Error("密码不对，再试一次"); x.pw = true; throw x; }
    let s = ""; bits.forEach(b => s += String.fromCharCode(b)); sessionStorage.setItem("magi_k", btoa(s));
    if (document.getElementById("rem").checked) try { localStorage.setItem("magi_pw", btoa(unescape(encodeURIComponent(pw)))); } catch (e) {}
    say("④ 打开中…");
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch (e) {
    btn.disabled = false;
    if (e.pw) { try { localStorage.removeItem("magi_pw"); } catch (_) {} if (silent) { say(""); return; } }
    say(e.message || String(e), true);
  }
}
document.getElementById("go").onclick = () => unlock(document.getElementById("pw").value, false);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(e.target.value, false); });
let saved = null; try { saved = localStorage.getItem("magi_pw"); } catch (e) {}
if (saved) unlock(decodeURIComponent(escape(atob(saved))), true);
</script></body></html>
